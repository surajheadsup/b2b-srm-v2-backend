version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=admin
    networks:
      - backend-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=production
      - PORT=9000
      - JWT_SECRET=your-secret-key-change-in-production
      - USER_SERVICE_URL=http://general-service:3000
      - GENERAL_SERVICE_URL=http://general-service:3000
      - FINANCE_SERVICE_URL=http://finance-service:3002
      - FILE_SERVICE_URL=http://file-service:3003
    depends_on:
      - general-service
      - finance-service
    networks:
      - backend-network

  general-service:
    build:
      context: ./general-service
      dockerfile: Dockerfile
    container_name: general-service
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/general-service
      - JWT_SECRET=your-secret-key-change-in-production
    depends_on:
      - mongodb
    networks:
      - backend-network

  finance-service:
    build:
      context: ./finance-service
      dockerfile: Dockerfile
    container_name: finance-service
    restart: always
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - MONGODB_URI=mongodb://mongodb:27017/finance-service
      - JWT_SECRET=your-secret-key-change-in-production
    depends_on:
      - mongodb
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
